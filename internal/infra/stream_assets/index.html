<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>vox-actor stream</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-history-size="__STREAM_HISTORY_SIZE__">
<main class="container">
  <h1>vox-actor stream</h1>
  <p class="status">状態: <span id="status">接続中</span></p>
  <label class="volume-row">
    音量
    <input type="range" id="volume" min="0" max="100" value="0">
    <span id="volume-icon">🔇</span>
  </label>
  <p class="hint">音量を上げると再生が始まります</p>
  <section class="timeline-section">
    <ol id="timeline" class="timeline" aria-live="polite"></ol>
  </section>
  <audio id="player" muted></audio>
</main>
<script src="/app.js"></script>
</body>
</html>
